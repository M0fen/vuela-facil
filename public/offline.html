<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Vuela Fácil Travel</title>
    <style>
      :root { --navy: #0d2c54; --coral: #e8631a; --ivory: #f7f3ec; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--ivory); color: var(--navy);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center; padding: 24px;
      }
      .card { max-width: 420px; }
      .badge {
        width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px;
        display: grid; place-items: center;
        background: linear-gradient(135deg, var(--coral), #f4a93c); color: #fff;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #4a5a72; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 999px;
        background: var(--navy); color: #fff; text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M2.5 13.5 3 11l7 1 4.5-6.5c.6-.9 2.1-.9 2.7 0 .4.6.3 1.4-.2 2L13 12l1 7-2.5.5L8.5 14l-3 2L4 18l-1-.5 1-3-2-1z" />
        </svg>
      </div>
      <h1>Estás sin conexión</h1>
      <p>
        No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo.
        Tus viajes te esperan ✈️
      </p>
      <a href="/">Reintentar</a>
    </div>
  </body>
</html>
